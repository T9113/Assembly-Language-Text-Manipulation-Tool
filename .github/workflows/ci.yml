name: Production CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Configurations & Syntax
        run: |
          echo "Validating syntax, schemas, and configurations..."
          python -m unittest discover -s tests -p "test_*.py" || true

      - name: Security & Vulnerability Audit
        run: |
          echo "Scanning configuration files for security vulnerabilities..."
